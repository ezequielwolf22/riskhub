<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>RiskHub — Mapa Conceptual</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#07071A; color:#fff; font-family:Inter,Arial,sans-serif; overflow:hidden; }
  canvas { display:block; }
  #tooltip {
    position:fixed; pointer-events:none; z-index:10;
    background:rgba(10,10,30,.95); border:1px solid rgba(89,0,141,.5);
    border-radius:10px; padding:12px 16px; max-width:260px;
    font-size:13px; line-height:1.6; display:none;
    box-shadow:0 4px 24px rgba(89,0,141,.3);
  }
  #tooltip strong { color:#D65200; display:block; margin-bottom:4px; }
  #legend {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    display:flex; gap:24px; background:rgba(10,10,30,.85);
    border:1px solid rgba(255,255,255,.1); border-radius:30px;
    padding:10px 24px; font-size:12px;
  }
  .leg { display:flex; align-items:center; gap:7px; }
  .leg-dot { width:12px; height:12px; border-radius:50%; }
  #title {
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none;
  }
  #title h1 { font-size:22px; font-weight:700; letter-spacing:.5px; }
  #title h1 span { color:#D65200; }
  #title p { font-size:12px; color:rgba(255,255,255,.45); margin-top:4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tooltip"></div>
<div id="title">
  <h1>Risk<span>Hub</span> — Arquitectura de capacidades</h1>
  <p>Pasa el cursor sobre los nodos para explorar cada componente</p>
</div>
<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#4A9EFF"></div>Fuentes de datos</div>
  <div class="leg"><div class="leg-dot" style="background:#59008D"></div>Motor de análisis</div>
  <div class="leg"><div class="leg-dot" style="background:#D65200"></div>Módulos SGSI</div>
  <div class="leg"><div class="leg-dot" style="background:#2EA84A"></div>Salidas automáticas</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tooltip');

// ─── Datos ───────────────────────────────────────────────────────────────────

const LAYERS = [
  {
    label: "Fuentes de datos", color: "#4A9EFF",
    nodes: [
      { id: 'docs',   label: "Documentos SGSI",     desc: "Políticas, procedimientos, evidencias y SOA subidos al agente IA. Formato PDF, DOCX, TXT." },
      { id: 'osint_src', label: "Objetivos OSINT",  desc: "Emails, dominios, IPs, URLs y usernames monitorizados continuamente." },
      { id: 'cve',    label: "CVE / NVD",           desc: "Base de datos NIST NVD. Escaneo automático diario de vulnerabilidades críticas." },
      { id: 'quest',  label: "Cuestionarios",       desc: "Cuestionarios de contexto organizacional y evaluación de proveedores." },
      { id: 'events', label: "Eventos manuales",    desc: "Incidentes, no conformidades y riesgos introducidos directamente por analistas." },
      { id: 'users',  label: "Usuarios / Roles",    desc: "Multi-usuario con roles admin, analyst y viewer. Multi-tenancy completo." },
    ]
  },
  {
    label: "Motor de análisis", color: "#59008D",
    nodes: [
      { id: 'ai',       label: "Agente IA (Claude)", desc: "Claude claude-haiku-4-5/Opus via Anthropic API. Tool-use proactivo: propone acciones que el usuario confirma antes de ejecutar." },
      { id: 'engine',   label: "Motor ISO 27005",    desc: "Matriz 5×5 Annex E.2. Calcula nivel inherente y residual. Soporta escala 0–8 con valoración CIA." },
      { id: 'isms',     label: "ISMS Analysis",      desc: "Análisis automático IA de documentos: detecta políticas, actualiza controles ISO 27002, crea tareas y vincula activos por nombre." },
      { id: 'osint_e',  label: "OSINT Engine",       desc: "Orquestador de escaneos: HIBP, LeakCheck, IntelX, VirusTotal, GitHub, DNS, SSL, RDAP, puertos abiertos." },
      { id: 'cve_e',    label: "CVE Scanner",        desc: "Consulta NVD API, correlaciona CVEs con el inventario de activos y genera riesgos automáticamente." },
      { id: 'sched',    label: "Scheduler (8 jobs)", desc: "APScheduler: escalada de tareas, revisión de políticas, degradación de controles, re-scan OSINT, informe mensual, alertas diarias." },
    ]
  },
  {
    label: "Módulos SGSI", color: "#D65200",
    nodes: [
      { id: 'assets',   label: "Activos",            desc: "Inventario ISO 27005 B.1: primarios e infraestructura. Valoración CIA (0–4). Análisis IA automático." },
      { id: 'risks',    label: "Riesgos",             desc: "RSK-XXXX. Matriz 5×5. Estados: Identified→Assessed→Treated→Accepted→Closed. Owner, fecha revisión." },
      { id: 'controls', label: "Controles ISO 27002", desc: "Catálogo completo 93 controles. SOA con justificación e incl./excl. Madurez CMM 0–5. Evidencias." },
      { id: 'inc',      label: "Incidentes (NIS2)",   desc: "Flujo NIS2 Art. 23: 24h/72h/1mes. Severidad P1–P4. Notificación supervisor. Lecciones aprendidas." },
      { id: 'sup',      label: "Proveedores",         desc: "Supply chain NIS2 Art. 21.2.d. Score 0–100. Auto-riesgo cuando score ≤ 30. Cuestionarios." },
      { id: 'pol',      label: "Políticas",           desc: "POL-XXXX. Ciclo de revisión configurable. Auto-creadas desde documentos SGSI." },
      { id: 'gdpr',     label: "GDPR / Auditoría",    desc: "Registro de tratamientos, DPO, base legal, transferencias. Log de auditoría inmutable de todas las operaciones." },
    ]
  },
  {
    label: "Salidas automáticas", color: "#2EA84A",
    nodes: [
      { id: 'auto_risk', label: "Riesgos auto-creados", desc: "Creados automáticamente por OSINT (hallazgos críticos), CVE (correlación activos) y proveedor (score bajo)." },
      { id: 'auto_task', label: "Tareas de tratamiento", desc: "TSK-XXXX generadas automáticamente por ISMS analysis, políticas vencidas, controles degradados y el agente IA." },
      { id: 'auto_inc',  label: "Incidentes auto",       desc: "INC-XXXX creados automáticamente cuando OSINT detecta hallazgos CRITICAL o HIGH." },
      { id: 'alerts',    label: "Alertas por email",     desc: "Reglas configurables: riesgo crítico, tratamiento vencido, NIS2 pendiente, digest diario, informe mensual." },
      { id: 'reports',   label: "Informes PDF",          desc: "Generación PDF con ReportLab. Informe ejecutivo, heatmap, SOA, cumplimiento. Con IA narrativa opcional." },
      { id: 'compliance',label: "Compliance Score",      desc: "ISO 27001, NIS2, NIST CSF 2.0 y ENS calculados en tiempo real con gaps y recomendaciones." },
      { id: 'ai_actions',label: "Acciones IA",           desc: "El agente propone crear tarea/incidente o actualizar riesgo. El usuario confirma antes de ejecutar." },
    ]
  },
];

// Conexiones entre nodos (from_id → to_id)
const EDGES = [
  // Fuentes → Motor
  ['docs','ai'], ['docs','isms'],
  ['osint_src','osint_e'],
  ['cve','cve_e'],
  ['quest','engine'], ['quest','ai'],
  ['events','engine'], ['events','sched'],
  ['users','ai'], ['users','engine'],
  // Motor → Módulos
  ['ai','risks'], ['ai','controls'], ['ai','inc'], ['ai','pol'],
  ['engine','risks'], ['engine','assets'],
  ['isms','controls'], ['isms','pol'], ['isms','assets'],
  ['osint_e','inc'], ['osint_e','risks'],
  ['cve_e','risks'], ['cve_e','assets'],
  ['sched','risks'], ['sched','controls'], ['sched','pol'],
  // Módulos → Salidas
  ['risks','auto_risk'], ['risks','compliance'], ['risks','auto_task'],
  ['controls','compliance'], ['controls','auto_task'],
  ['inc','auto_inc'], ['inc','alerts'],
  ['sup','auto_risk'], ['sup','alerts'],
  ['pol','auto_task'], ['pol','alerts'],
  ['assets','auto_risk'], ['assets','compliance'],
  ['gdpr','reports'], ['gdpr','compliance'],
  ['ai','ai_actions'], ['ai','reports'],
];

// ─── Layout ──────────────────────────────────────────────────────────────────

let W, H, nodes, edges, particles = [], mouse = { x: -999, y: -999 };

function buildLayout() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;

  const PAD_X = 100, PAD_TOP = 90, PAD_BOT = 80;
  const usableW = W - PAD_X * 2;
  const usableH = H - PAD_TOP - PAD_BOT;
  const layerX = i => PAD_X + (usableW / (LAYERS.length - 1)) * i;

  const nodeMap = {};
  nodes = [];
  LAYERS.forEach((layer, li) => {
    const nx = layerX(li);
    const nodeCount = layer.nodes.length;
    layer.nodes.forEach((n, ni) => {
      const ny = PAD_TOP + usableH * ((ni + 0.5) / nodeCount);
      const node = {
        id: n.id, label: n.label, desc: n.desc,
        x: nx, y: ny, r: 22,
        color: layer.color, layer: li,
        glow: Math.random() * Math.PI * 2,   // phase offset for pulse
      };
      nodeMap[n.id] = node;
      nodes.push(node);
    });
  });

  edges = EDGES.map(([a, b]) => ({
    from: nodeMap[a], to: nodeMap[b],
    color: nodeMap[a] ? nodeMap[a].color : '#fff',
  })).filter(e => e.from && e.to);
}

// ─── Particles ───────────────────────────────────────────────────────────────

function spawnParticle() {
  if (edges.length === 0) return;
  const e = edges[Math.floor(Math.random() * edges.length)];
  particles.push({ edge: e, t: 0, speed: 0.003 + Math.random() * 0.004 });
}

function updateParticles() {
  if (particles.length < 80 && Math.random() < 0.3) spawnParticle();
  particles = particles.filter(p => {
    p.t += p.speed;
    return p.t <= 1;
  });
}

// ─── Drawing ─────────────────────────────────────────────────────────────────

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawEdges() {
  edges.forEach(e => {
    const grad = ctx.createLinearGradient(e.from.x, e.from.y, e.to.x, e.to.y);
    grad.addColorStop(0, hexAlpha(e.from.color, 0.12));
    grad.addColorStop(1, hexAlpha(e.to.color, 0.12));
    ctx.beginPath();
    ctx.moveTo(e.from.x, e.from.y);
    ctx.lineTo(e.to.x, e.to.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function drawParticles() {
  particles.forEach(p => {
    const x = p.edge.from.x + (p.edge.to.x - p.edge.from.x) * p.t;
    const y = p.edge.from.y + (p.edge.to.y - p.edge.from.y) * p.t;
    const alpha = Math.sin(p.t * Math.PI);
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = hexAlpha(p.edge.color, alpha * 0.9);
    ctx.fill();
    // Trail
    ctx.beginPath();
    const tx = p.edge.from.x + (p.edge.to.x - p.edge.from.x) * Math.max(0, p.t - 0.04);
    const ty = p.edge.from.y + (p.edge.to.y - p.edge.from.y) * Math.max(0, p.t - 0.04);
    ctx.moveTo(tx, ty); ctx.lineTo(x, y);
    ctx.strokeStyle = hexAlpha(p.edge.color, alpha * 0.35);
    ctx.lineWidth = 1.5; ctx.stroke();
  });
}

function drawNodes(t) {
  nodes.forEach(n => {
    const hovered = Math.hypot(mouse.x - n.x, mouse.y - n.y) < n.r + 10;
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.0015 + n.glow);
    const glowR = n.r + 8 + pulse * 6;

    // Glow
    const grd = ctx.createRadialGradient(n.x, n.y, n.r * 0.3, n.x, n.y, glowR + (hovered ? 10 : 0));
    grd.addColorStop(0, hexAlpha(n.color, 0.35 + pulse * 0.15));
    grd.addColorStop(1, hexAlpha(n.color, 0));
    ctx.beginPath();
    ctx.arc(n.x, n.y, glowR + (hovered ? 10 : 0), 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Circle
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r + (hovered ? 3 : 0), 0, Math.PI * 2);
    ctx.fillStyle = hovered ? n.color : hexAlpha(n.color, 0.18);
    ctx.fill();
    ctx.strokeStyle = hexAlpha(n.color, hovered ? 1 : 0.6);
    ctx.lineWidth = hovered ? 2.5 : 1.5;
    ctx.stroke();

    // Label
    ctx.font = `${hovered ? 600 : 500} 11px Inter,Arial,sans-serif`;
    ctx.fillStyle = hovered ? '#fff' : 'rgba(255,255,255,0.8)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Word-wrap label
    const words = n.label.split(' ');
    const maxW = 80;
    let line = '', lines = [];
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    });
    lines.push(line);
    const lineH = 13;
    lines.forEach((l, i) => {
      ctx.fillText(l, n.x, n.y + (i - (lines.length - 1) / 2) * lineH);
    });
  });
}

function drawLayerLabels() {
  LAYERS.forEach((layer, li) => {
    const PAD_X = 100, usableW = W - PAD_X * 2;
    const x = PAD_X + (usableW / (LAYERS.length - 1)) * li;
    ctx.font = '600 11px Inter,Arial,sans-serif';
    ctx.fillStyle = hexAlpha(layer.color, 0.7);
    ctx.textAlign = 'center';
    ctx.fillText(layer.label.toUpperCase(), x, 68);

    // Small divider line
    ctx.beginPath();
    ctx.moveTo(x - 40, 75); ctx.lineTo(x + 40, 75);
    ctx.strokeStyle = hexAlpha(layer.color, 0.3);
    ctx.lineWidth = 1; ctx.stroke();
  });
}

// ─── Loop ────────────────────────────────────────────────────────────────────

function loop(t) {
  ctx.clearRect(0, 0, W, H);

  // Background grid (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  drawLayerLabels();
  drawEdges();
  updateParticles();
  drawParticles();
  drawNodes(t);
  requestAnimationFrame(loop);
}

// ─── Tooltip ─────────────────────────────────────────────────────────────────

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  const hit = nodes.find(n => Math.hypot(e.clientX - n.x, e.clientY - n.y) < n.r + 10);
  if (hit) {
    tip.style.display = 'block';
    tip.innerHTML = `<strong>${hit.label}</strong>${hit.desc}`;
    const tx = Math.min(e.clientX + 18, W - 280);
    const ty = Math.min(e.clientY - 10, H - 120);
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ─── Init ────────────────────────────────────────────────────────────────────

buildLayout();
window.addEventListener('resize', buildLayout);
requestAnimationFrame(loop);
</script>
</body>
</html>
