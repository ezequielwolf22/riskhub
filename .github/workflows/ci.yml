name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests y linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Linting con ruff
        run: ruff check app/

      - name: Tests con pytest
        env:
          RISKHUB_ENV: test
          RISKHUB_SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
          RISKHUB_ADMIN_EMAIL: admin@test.internal
          RISKHUB_ADMIN_PASSWORD: TestAdmin123!
          RISKHUB_DB_PATH: ./test_riskhub.db
        run: pytest tests/ -v --tb=short --timeout=30

      - name: Limpiar BD de test
        if: always()
        run: rm -f ./test_riskhub.db

  test-postgres:
    name: Tests sobre PostgreSQL (portabilidad)
    runs-on: ubuntu-latest
    # No bloqueante: valida la portabilidad a PostgreSQL sin frenar el merge
    # mientras se completa la Fase 1 (tsvector/FTS). Ver docs/POSTGRES_MIGRATION_PLAN.md.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riskhub
          POSTGRES_PASSWORD: riskhub
          POSTGRES_DB: riskhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests con pytest sobre PostgreSQL
        env:
          RISKHUB_ENV: test
          RISKHUB_SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
          RISKHUB_ADMIN_EMAIL: admin@test.internal
          RISKHUB_ADMIN_PASSWORD: TestAdmin123!
          RISKHUB_DATABASE_URL: postgresql+psycopg2://riskhub:riskhub@localhost:5432/riskhub_test
        run: pytest tests/ --tb=short --timeout=60

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t riskhub:ci-check .
