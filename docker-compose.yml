services:
  riskhub:
    build: .
    image: riskhub:latest
    container_name: riskhub
    restart: unless-stopped
    # No external port mapping — traffic enters exclusively through nginx.
    # For local dev without nginx, override with: RISKHUB_PORT_HOST=8000
    expose:
      - "8000"
    environment:
      - RISKHUB_SECRET_KEY=${RISKHUB_SECRET_KEY:?Define RISKHUB_SECRET_KEY en .env}
      - RISKHUB_ADMIN_EMAIL=${RISKHUB_ADMIN_EMAIL:-admin@company.internal}
      - RISKHUB_ADMIN_PASSWORD=${RISKHUB_ADMIN_PASSWORD:?Define RISKHUB_ADMIN_PASSWORD en .env}
      - RISKHUB_DB_PATH=/srv/data/riskhub.db
      - RISKHUB_ENV=production
      - RISKHUB_PUBLIC_URL=${RISKHUB_PUBLIC_URL:-}
      - RISKHUB_ANTHROPIC_API_KEY=${RISKHUB_ANTHROPIC_API_KEY:-}
      - RISKHUB_HIBP_API_KEY=${RISKHUB_HIBP_API_KEY:-}
      - RISKHUB_VIRUSTOTAL_API_KEY=${RISKHUB_VIRUSTOTAL_API_KEY:-}
      - RISKHUB_LEAKCHECK_API_KEY=${RISKHUB_LEAKCHECK_API_KEY:-}
      - RISKHUB_INTELX_API_KEY=${RISKHUB_INTELX_API_KEY:-}
      - RISKHUB_GITHUB_API_TOKEN=${RISKHUB_GITHUB_API_TOKEN:-}
    volumes:
      - riskhub-data:/srv/data
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: riskhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - riskhub
    networks:
      - internal

volumes:
  riskhub-data:
    driver: local

networks:
  internal:
    driver: bridge
