<!DOCTYPE html>
<html lang="es" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiskHub</title>
<link rel="stylesheet" href="/css/app.css?v=3.1.0">
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<script>
  (function() {
    if (!localStorage.getItem('riskhub_token')) {
      window.location.replace('/login');
      return;
    }
    var theme = localStorage.getItem('riskhub_theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    var lang = localStorage.getItem('riskhub_lang') || 'es';
    document.documentElement.setAttribute('lang', lang);
  })();
</script>
</head>
<body>

<div class="app-shell">
  <div class="brand-bar"></div>

  <header class="app-header">
    <div class="app-logo">
      <img src="/img/logo.svg" alt="RiskHub" class="logo-svg">
      <div class="product">
        RiskHub
        <small>ISO/IEC 27005:2018</small>
      </div>
    </div>
    <div class="search-wrapper" id="search-wrapper">
      <input id="search-input" class="search-input" type="text"
             data-i18n-placeholder="shell.search_placeholder"
             placeholder="Buscar activos, riesgos, amenazas..." autocomplete="off" spellcheck="false">
      <div id="search-dropdown" class="search-dropdown" style="display:none;"></div>
    </div>
    <!-- Notification bell -->
    <button class="btn btn-ghost btn-icon notif-btn" id="btn-notifications" data-i18n-title="shell.notifications" data-i18n-aria-label="shell.notifications" title="Notificaciones" aria-label="Notificaciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="notif-count" class="notif-badge" style="display:none;"></span>
    </button>
    <div id="org-context-selector" style="display:none;position:relative;margin-right:8px;"></div>
    <div class="header-right">
      <span class="user-chip" id="user-chip">
        <span id="user-name">-</span>
        <span class="role" id="user-role">-</span>
      </span>
      <button class="btn btn-ghost btn-icon" id="btn-lang" title="Switch language" aria-label="Switch language" style="font-size:11px;font-weight:600;letter-spacing:.04em;min-width:32px;">
        <span id="lang-label">EN</span>
      </button>
      <button class="btn btn-ghost btn-icon" id="btn-theme" data-i18n-title="shell.change_theme" data-i18n-aria-label="shell.change_theme" title="Cambiar tema (claro/oscuro)" aria-label="Cambiar tema">
        <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="btn btn-ghost" id="btn-logout" data-i18n-title="shell.logout" title="Cerrar sesión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar hub-nav" id="sidebar">

      <!-- Sidebar: 10 hubs con pestanas internas (progressive disclosure) -->
      <a href="#/home" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span data-i18n="nav.home">Inicio</span></a>
      <a href="#/risk-hub" data-route="risk-hub"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span data-i18n="nav.risks_assets">Riesgos y activos</span><span id="badge-overdue" style="display:none;" class="sidebar-badge sidebar-badge-danger"></span></a>
      <a href="#/watch-hub" data-route="watch-hub" data-minrole="analyst"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span data-i18n="nav.watch">Vigilancia</span></a>
      <a href="#/compliance-hub" data-route="compliance-hub"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg><span data-i18n="nav.compliance">Cumplimiento</span><span id="badge-ctrl-review" style="display:none;" class="sidebar-badge sidebar-badge-warning"></span><span id="badge-nis2-urgent" style="display:none;" class="sidebar-badge sidebar-badge-danger"></span></a>
      <a href="#/events-hub" data-route="events-hub" data-minrole="analyst"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span data-i18n="nav.incidents">Incidentes</span></a>
      <a href="#/bcp-hub" data-route="bcp-hub"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><span data-i18n="nav.bcp">BCP / BCM</span></a>
      <a href="#/suppliers-hub" data-route="suppliers-hub" data-minrole="analyst"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span data-i18n="nav.suppliers">Proveedores</span></a>
      <a href="#/reports-hub" data-route="reports-hub"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span data-i18n="nav.reports">Informes</span><span id="badge-tasks-overdue" style="display:none;" class="sidebar-badge sidebar-badge-danger"></span></a>
      <a href="#/ai-hub" data-route="ai-hub" data-minrole="analyst"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i18n="nav.ai">Agente IA</span></a>
      <a href="#/setup-hub" data-route="setup-hub" data-minrole="analyst"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span data-i18n="nav.setup">Setup</span></a>
      <a href="#/admin-hub" data-route="admin-hub" data-admin class="nav-admin-sep"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="nav.config">Configuración</span></a>

      <!-- Ayuda: ruta #/guide accesible desde el pie del sidebar -->
      <a href="#/guide" data-route="guide" class="nav-help-link"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span data-i18n="nav.guide">Guía de uso</span></a>


      <div class="sidebar-toggle-wrap">
        <button class="sidebar-toggle-btn" id="btn-sidebar-toggle" title="Contraer/expandir" aria-label="Contraer barra lateral">
          <svg id="sidebar-icon-collapse" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          <svg id="sidebar-icon-expand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </nav>

    <main class="app-content" id="main">
      <div id="app-loading-skeleton" style="padding:32px 24px;">
        <div style="height:28px;width:220px;background:var(--bg-3,#e5e7eb);border-radius:6px;margin-bottom:20px;animation:skeleton-pulse 1.4s ease-in-out infinite;"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px;">
          <div style="height:88px;background:var(--bg-3,#e5e7eb);border-radius:8px;animation:skeleton-pulse 1.4s ease-in-out infinite;"></div>
          <div style="height:88px;background:var(--bg-3,#e5e7eb);border-radius:8px;animation:skeleton-pulse 1.4s ease-in-out infinite;animation-delay:.1s;"></div>
          <div style="height:88px;background:var(--bg-3,#e5e7eb);border-radius:8px;animation:skeleton-pulse 1.4s ease-in-out infinite;animation-delay:.2s;"></div>
          <div style="height:88px;background:var(--bg-3,#e5e7eb);border-radius:8px;animation:skeleton-pulse 1.4s ease-in-out infinite;animation-delay:.3s;"></div>
        </div>
        <div style="height:180px;background:var(--bg-3,#e5e7eb);border-radius:8px;animation:skeleton-pulse 1.4s ease-in-out infinite;margin-bottom:12px;"></div>
        <div style="height:120px;background:var(--bg-3,#e5e7eb);border-radius:8px;animation:skeleton-pulse 1.4s ease-in-out infinite;animation-delay:.15s;"></div>
      </div>
      <style>
        @keyframes skeleton-pulse {
          0%,100%{opacity:1} 50%{opacity:.4}
        }
      </style>
    </main>
  </div>

  <!-- Quick actions floating button -->
  <div class="quick-actions-fab" id="quick-actions-fab">
    <button class="fab-main" id="fab-toggle" title="Acciones rapidas">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="fab-menu" id="fab-menu" style="display:none;">
      <button class="fab-item" onclick="location.hash='/risk-hub/risks';document.getElementById('fab-menu').style.display='none';" data-i18n-title="fab.new_risk" title="Nuevo Riesgo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span data-i18n="fab.new_risk">Nuevo Riesgo</span>
      </button>
      <button class="fab-item" onclick="location.hash='/events-hub/incidents';document.getElementById('fab-menu').style.display='none';" data-i18n-title="fab.new_incident" title="Nuevo Incidente">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>
        <span data-i18n="fab.new_incident">Nuevo Incidente</span>
      </button>
      <button class="fab-item" onclick="location.hash='/ai-hub/chat';document.getElementById('fab-menu').style.display='none';" data-i18n-title="fab.ai_agent" title="Agente IA">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Agente IA</span>
      </button>
    </div>
  </div>
</div>
