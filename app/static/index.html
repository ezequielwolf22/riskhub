<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiskHub</title>
<link rel="stylesheet" href="/css/app.css?v=1.0.2">
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<script>
  (function() {
    var t = localStorage.getItem('riskhub_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<div class="app-shell">
  <div class="brand-bar"></div>

  <header class="app-header">
    <div class="app-logo">
      <img src="/img/logo.svg" alt="RiskHub" class="logo-svg">
      <div class="product">
        RiskHub
        <small>ISO/IEC 27005:2018</small>
      </div>
    </div>
    <div class="search-wrapper" id="search-wrapper">
      <input id="search-input" class="search-input" type="text"
             placeholder="Buscar activos, riesgos, amenazas..." autocomplete="off" spellcheck="false">
      <div id="search-dropdown" class="search-dropdown" style="display:none;"></div>
    </div>
    <div class="header-right">
      <span class="user-chip" id="user-chip">
        <span id="user-name">-</span>
        <span class="role" id="user-role">-</span>
      </span>
      <button class="btn btn-ghost btn-icon" id="btn-theme" title="Cambiar tema (claro/oscuro)" aria-label="Cambiar tema">
        <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="btn btn-ghost" id="btn-logout" title="Cerrar sesion">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar" id="sidebar">
      <div class="group">Vision global</div>
      <a href="#/dashboard" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a href="#/heatmap" data-route="heatmap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
        Heatmap
      </a>

      <div class="group">Identificación</div>
      <a href="#/assets" data-route="assets">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Activos
      </a>
      <a href="#/threats" data-route="threats">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Amenazas
      </a>
      <a href="#/vulnerabilities" data-route="vulnerabilities">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Vulnerabilidades
      </a>

      <div class="group">Análisis y tratamiento</div>
      <a href="#/questionnaire" data-route="questionnaire">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Agente IA
      </a>
      <a href="#/risks" data-route="risks" style="justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Riesgos
        </span>
        <span id="badge-overdue" style="display:none;background:var(--risk-high);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;"></span>
      </a>
      <a href="#/calendar" data-route="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendario
      </a>
      <a href="#/controls" data-route="controls" style="justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Controles
        </span>
        <span id="badge-ctrl-review" style="display:none;background:var(--brand-orange);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;" title="Revisiones de controles vencidas"></span>
      </a>

      <div class="group">Informes y administración</div>
      <a href="#/reports" data-route="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Informes
      </a>
      <a href="#/alerts" data-route="alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Alertas
      </a>
      <a href="#/integrations" data-route="integrations">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>
        Integraciones
      </a>
      <a href="#/context" data-route="context">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Contexto
      </a>
      <a href="#/users" data-route="users" data-admin>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuarios
      </a>
      <a href="#/audit" data-route="audit" data-admin>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Auditoria
      </a>

      <div class="group">Ayuda</div>
      <a href="#/guide" data-route="guide">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Guia de uso
      </a>

      <div style="margin-top:auto;padding:12px 0 4px;">
        <button class="sidebar-toggle-btn" id="btn-sidebar-toggle" title="Contraer/expandir barra lateral" aria-label="Contraer barra lateral">
          <svg id="sidebar-icon-collapse" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          <svg id="sidebar-icon-expand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </nav>

    <main class="app-content" id="main"></main>
  </div>
</div>

<div id="modal-root"></div>

<script src="/js/api.js?v=1.0.1"></script>
<script src="/js/auth.js?v=1.0.1"></script>
<script src="/js/ui.js?v=1.0.1"></script>
<script src="/js/views/dashboard.js?v=1.0.1"></script>
<script src="/js/views/heatmap.js?v=1.0.1"></script>
<script src="/js/views/assets.js?v=1.0.1"></script>
<script src="/js/views/threats.js?v=1.0.1"></script>
<script src="/js/views/vulnerabilities.js?v=1.0.1"></script>
<script src="/js/views/risks.js?v=1.0.1"></script>
<script src="/js/views/controls.js?v=1.0.1"></script>
<script src="/js/views/reports.js?v=1.0.1"></script>
<script src="/js/views/context.js?v=1.0.1"></script>
<script src="/js/views/questionnaire.js?v=1.0.1"></script>
<script src="/js/views/alerts.js?v=1.0.1"></script>
<script src="/js/views/integrations.js?v=1.0.1"></script>
<script src="/js/views/guide.js?v=1.0.1"></script>
<script src="/js/views/users.js?v=1.0.1"></script>
<script src="/js/views/audit.js?v=1.0.1"></script>
<script src="/js/views/calendar.js?v=1.0.1"></script>
<script src="/js/search.js?v=1.0.1"></script>
<script src="/js/app.js?v=1.0.1"></script>
</body>
</html>
